<script>
(function () {
  'use strict';

  var LEFT_KEY  = 'rl-left-sidebar-hidden';
  var RIGHT_KEY = 'rl-right-sidebar-hidden';

  function save(key, on) {
    try { localStorage.setItem(key, on ? '1' : '0'); } catch (e) {}
  }

  function load(key) {
    try { return localStorage.getItem(key) === '1'; } catch (e) { return false; }
  }

  function setup(opts) {
    var sidebar = document.getElementById(opts.sidebarId);
    if (!sidebar) return;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = opts.id;
    btn.className = 'sidebar-toggle-btn ' + opts.btnClass;
    btn.setAttribute('aria-label', opts.label);
    btn.setAttribute('title', opts.label);
    document.body.appendChild(btn);

    function isCollapsed() {
      return document.body.classList.contains(opts.bodyClass);
    }

    /* Keep the button flush against the sidebar's current edge. The sidebar
       animates its width (0.28s), so this is re-run on every width change
       rather than once after a short delay. */
    function place() {
      var rect = sidebar.getBoundingClientRect();
      var collapsed = isCollapsed();
      var laidOut = rect.width > 1 &&
                    window.getComputedStyle(sidebar).display !== 'none';

      /* Quarto swaps the sidebar for its own offcanvas UI on narrow
         viewports; don't add a second control there. */
      if (!laidOut && !collapsed) {
        btn.hidden = true;
        return;
      }
      btn.hidden = false;

      var other = opts.edge === 'left' ? 'right' : 'left';
      if (collapsed) {
        btn.style[opts.edge] = '0px';
        btn.style[other] = 'auto';
        return;
      }
      btn.style[opts.edge] = (opts.edge === 'left'
        ? Math.round(rect.right)
        : Math.round(window.innerWidth - rect.left)) + 'px';
      btn.style[other] = 'auto';
    }

    function apply(collapsed, persist) {
      document.body.classList.toggle(opts.bodyClass, collapsed);
      btn.textContent = collapsed ? opts.iconCollapsed : opts.iconExpanded;
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      place();
      if (persist) save(opts.key, collapsed);
    }

    /* Restore the saved preference before painting where possible */
    apply(load(opts.key), false);

    btn.addEventListener('click', function () {
      apply(!isCollapsed(), true);
    });

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { place(); }).observe(sidebar);
    }

    /* Catch the end of the collapse/expand animation */
    sidebar.addEventListener('transitionend', function (e) {
      if (e.target === sidebar) place();
    });

    /* One placement per frame, not one per resize event */
    var queued = false;
    window.addEventListener('resize', function () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () {
        queued = false;
        place();
      });
    });

    /* Late layout shifts: web font swap, theme toggle, image load */
    window.addEventListener('load', place);
  }

  function init() {
    setup({
      sidebarId: 'quarto-sidebar',
      bodyClass: 'left-sidebar-hidden',
      key: LEFT_KEY,
      id: 'left-sidebar-toggle',
      btnClass: 'left-toggle',
      edge: 'left',
      label: 'Toggle navigation sidebar',
      iconExpanded: '‹',
      iconCollapsed: '›'
    });

    setup({
      sidebarId: 'quarto-margin-sidebar',
      bodyClass: 'right-sidebar-hidden',
      key: RIGHT_KEY,
      id: 'right-sidebar-toggle',
      btnClass: 'right-toggle',
      edge: 'right',
      label: 'Toggle page TOC',
      iconExpanded: '›',
      iconCollapsed: '‹'
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
