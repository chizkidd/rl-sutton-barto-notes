name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Install TinyTeX
        run: quarto install tinytex

      # The PDF header needs microtype, amssymb and enumitem. Installing them
      # explicitly keeps the deploy independent of Quarto's on-the-fly package
      # resolution, which cannot see packages outside TinyTeX's base set (that
      # is what stalled the build on newunicodechar.sty).
      - name: Install LaTeX packages
        run: |
          export PATH="$(echo "$HOME"/.TinyTeX/bin/*):$PATH"
          tlmgr install microtype amsfonts enumitem

      - name: Render Book
        run: quarto render

      - name: Verify PDF output
        run: test -s _site/rl-notes.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
