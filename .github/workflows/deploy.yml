name: Build and Deploy

# One job that renders the book, one that publishes it. Nothing gates the
# render beyond "the PDF exists", which is the only thing that has ever broken.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Pinned so the PDF lays out the same way every run:
#   - TINYTEX_VERSION's TeX Live year must match TEXLIVE_REPO.
#   - The archive only freezes a repository once a TeX Live year is finished,
#     so this tracks the newest completed year. Move both to 2026 when it lands.
env:
  TINYTEX_VERSION: "2025.12"
  TEXLIVE_YEAR: "2025"
  TEXLIVE_REPO: "https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2025/tlnet-final/"
  LATEX_PACKAGES: "microtype enumitem"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.5.57"

      - name: Install TinyTeX ${{ env.TINYTEX_VERSION }}
        run: |
          curl -sL https://yihui.org/tinytex/install-bin-unix.sh -o "$RUNNER_TEMP/install-tinytex.sh"
          TINYTEX_VERSION="$TINYTEX_VERSION" sh "$RUNNER_TEMP/install-tinytex.sh"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      # The TinyTeX bundle ships amsmath but not microtype or enumitem, so those
      # come from the frozen repository rather than the moving CTAN mirror.
      - name: Install LaTeX packages
        run: |
          tlmgr option repository "$TEXLIVE_REPO"
          tlmgr update --self
          tlmgr install $LATEX_PACKAGES

      - name: Render Book
        run: quarto render

      - name: Verify PDF output
        run: test -s _site/rl-notes.pdf

      # The deck is built from the same sources as the PDF, right after it.
      - name: Build the Anki deck
        run: node scripts/export-anki.cjs --out _site/rl-notes-anki.tsv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
