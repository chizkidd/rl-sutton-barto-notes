name: Deploy Quarto Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# The PDF is built by a fixed toolchain so that a render which passed today
# renders the same way later. Bump these deliberately, as a pair:
#   - TINYTEX_VERSION picks the TinyTeX release; its TeX Live year must match
#     TEXLIVE_REPO_FROM below.
#   - The archive only publishes a frozen repository once a TeX Live year is
#     finished, so this tracks the newest completed year (2025 as of Nov 2026).
#     When TeX Live 2026 is archived, move both to 2026.
env:
  TINYTEX_VERSION: "2025.12"
  TEXLIVE_YEAR: "2025"
  TEXLIVE_REPO: "https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2025/tlnet-final/"
  LATEX_PACKAGES: "microtype enumitem"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.5.57"

      - name: Install TinyTeX ${{ env.TINYTEX_VERSION }}
        run: |
          curl -sL https://yihui.org/tinytex/install-bin-unix.sh -o "$RUNNER_TEMP/install-tinytex.sh"
          TINYTEX_VERSION="$TINYTEX_VERSION" sh "$RUNNER_TEMP/install-tinytex.sh"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      # The pinned bundle carries amsfonts/amssymb but not microtype or
      # enumitem, so those two come from the frozen TeX Live repository rather
      # than the moving CTAN mirror. tlmgr has to update itself first, or it
      # refuses to install from an archived repository.
      - name: Pin TeX Live packages to the frozen ${{ env.TEXLIVE_YEAR }} repository
        run: |
          tlmgr option repository "$TEXLIVE_REPO"
          tlmgr update --self
          tlmgr install $LATEX_PACKAGES
          tlmgr info $LATEX_PACKAGES | grep -E '^(package|revision):'

      - name: Verify the pinned toolchain
        run: |
          set -euo pipefail
          xelatex --version | head -1
          for pkg in microtype.sty amssymb.sty enumitem.sty; do
            if [ -z "$(kpsewhich "$pkg")" ]; then echo "missing $pkg"; exit 1; fi
          done
          echo "toolchain OK"

      - name: Render Book
        run: quarto render

      - name: Verify PDF output
        run: test -s _site/rl-notes.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4