
project:
  type: book
  output-dir: _site
  # Quarto and pandoc emit a few attributes that EPUB 3.3 rejects (alt on the
  # figure div, displaystyle on mfrac, a blank date); this repairs them in the
  # archive after every render so `quarto render` produces a conforming EPUB.
  post-render: scripts/fix-epub.py
  # The gallery points at the WebP copies from raw <picture> markup, which the
  # resource scanner does not follow, so they have to be named here or they are
  # never copied into _site.
  resources:
    - figures/webp

book:
  title: "Study Notes on Reinforcement Learning: An Introduction (2nd Ed.)"
  subtitle: "Independent personal study notes accompanying Sutton & Barto (2020)"
  author: "Chizoba Obasi"
  date: last-modified
  date-format: "MMMM YYYY"
  output-file: "rl-notes"
  site-url: "https://chizkidd.github.io/rl-sutton-barto-notes"
  repo-url: https://github.com/chizkidd/rl-sutton-barto-notes
  repo-actions: [issue]
  downloads: [pdf, epub]
  search: true
  page-navigation: true
  google-analytics: "G-F6HCEEPQLV"
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - text: "---"
    - part: "Tabular Solution Methods"
      chapters:
        - chapters/ch01-introduction.qmd
        - chapters/ch02-multi-armed-bandits.qmd
        - chapters/ch03-finite-mdps.qmd
        - chapters/ch04-dynamic-programming.qmd
        - chapters/ch05-monte-carlo.qmd
        - chapters/ch06-temporal-difference.qmd
        - chapters/ch07-nstep-bootstrapping.qmd
        - chapters/ch08-planning-learning.qmd
    - part: "Approximate Solution Methods"
      chapters:
        - chapters/ch09-on-policy-prediction-approximation.qmd
        - chapters/ch10-on-policy-control-approximation.qmd
        - chapters/ch11-off-policy-methods-approximation.qmd
        - chapters/ch12-eligibility-traces.qmd
        - chapters/ch13-policy-gradient-methods.qmd
  appendices:
    - gallery.qmd
    - notation.qmd

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-depth: 3
    number-sections: true
    code-fold: false
    highlight-style: github
    mainfont: "Georgia, serif"
    monofont: "JetBrains Mono, monospace"
    fontsize: 1.05em
    linestretch: 1.7
    smooth-scroll: true
    include-after-body: sidebar-toggle.html
    fig-align: center
    html-math-method: katex

  pdf:
    documentclass: scrbook
    classoption: [oneside, openany]
    papersize: letter
    fontsize: 10pt
    linestretch: 1.02
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    fig-pos: "htbp"
    fig-align: center
    geometry:
      - top=0.7in
      - bottom=0.75in
      - left=0.8in
      - right=0.8in
    include-in-header:
      text: |
        \usepackage{microtype}
        \usepackage{amssymb}
        \usepackage{enumitem}
        \setlist{nosep,leftmargin=1.2em}
        \setlength{\parskip}{0.35em}
        \setlength{\parindent}{0pt}
        \raggedbottom
        \setlength{\abovedisplayskip}{4pt plus 1pt minus 1pt}
        \setlength{\belowdisplayskip}{4pt plus 1pt minus 1pt}
        \setlength{\abovedisplayshortskip}{2pt plus 1pt}
        \setlength{\belowdisplayshortskip}{2pt plus 1pt}
        \setlength{\jot}{3pt}
        \setlength{\columnsep}{18pt}
        \setcounter{secnumdepth}{2}
        % --- pagination: no one-line spills, no headings stranded at a page foot
        % The widow/club penalties do the second part on their own: LaTeX never
        % breaks between a heading and the lines under it (\@afterheading), so a
        % heading cannot end a page. A \NeedSpace wrapper around \section used to
        % sit here; it fired whenever \pagetotal was already past \pagegoal, which
        % broke the page at the heading and left a near-blank page at section 1.5.
        \widowpenalty=10000
        \clubpenalty=10000
        \displaywidowpenalty=10000
        \renewcommand*{\captionformat}{\ }
        % --- table of contents: the last entry (Notation Index) was pushed onto a
        % fifth page by one line. The class leaves 1em before each chapter entry;
        % tightening that to 6pt pulls the entry back onto the fourth page without
        % changing the toc's type, alignment or dot leaders.
        \DeclareTOCStyleEntry[beforeskip=8pt]{tocline}{chapter}

  epub:
    toc: true
    toc-depth: 2
    number-sections: true
    cover-image: figures/epub-cover.png
    css: styles/epub.css

bibliography: references.bib
