
project:
  type: book
  output-dir: _site

book:
  title: "Reinforcement Learning: An Introduction (2nd Edition)"
  subtitle: "Personal study notes"
  author: "Chizoba Obasi"
  date: last-modified
  date-format: "MMMM YYYY"
  output-file: "rl-notes"
  site-url: "https://chizkidd.github.io/rl-sutton-barto-notes"
  repo-url: https://github.com/chizkidd/rl-sutton-barto-notes
  repo-actions: [issue]
  downloads: [pdf]
  search: true
  page-navigation: true
  google-analytics: "G-F6HCEEPQLV"
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - text: "---"
    - part: "Part I — Tabular Solution Methods"
      chapters:
        - chapters/ch01-introduction.qmd
        - chapters/ch02-multi-armed-bandits.qmd
        - chapters/ch03-finite-mdps.qmd
        - chapters/ch04-dynamic-programming.qmd
        - chapters/ch05-monte-carlo.qmd
        - chapters/ch06-temporal-difference.qmd
        - chapters/ch07-nstep-bootstrapping.qmd
        - chapters/ch08-planning-learning.qmd
    - part: "Part II — Approximate Solution Methods"
      chapters:
        - chapters/ch09-on-policy-prediction-approximation.qmd
        - chapters/ch10-on-policy-control-approximation.qmd
        - chapters/ch11-off-policy-methods-approximation.qmd
        - chapters/ch12-eligibility-traces.qmd
        - chapters/ch13-policy-gradient-methods.qmd
  appendices:
    - gallery.qmd

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-depth: 3
    number-sections: true
    code-fold: false
    highlight-style: github
    mainfont: "Georgia, serif"
    monofont: "JetBrains Mono, monospace"
    fontsize: 1.05em
    linestretch: 1.7
    smooth-scroll: true
    include-after-body: sidebar-toggle.html
    fig-align: center
    html-math-method: katex

  pdf:
    documentclass: scrbook
    classoption: [oneside, openany]
    papersize: letter
    fontsize: 10pt
    linestretch: 1.02
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    fig-pos: "htbp"
    fig-align: center
    geometry:
      - top=0.7in
      - bottom=0.75in
      - left=0.8in
      - right=0.8in
    include-in-header:
      text: |
        \usepackage{microtype}
        \usepackage{amssymb}
        \usepackage{newunicodechar}
        \newunicodechar{✓}{\checkmark}
        \usepackage{enumitem}
        \setlist{nosep,leftmargin=1.2em}
        \setlength{\parskip}{0.35em}
        \setlength{\parindent}{0pt}
        \raggedbottom
        \setlength{\abovedisplayskip}{5pt}
        \setlength{\belowdisplayskip}{5pt}
        \setlength{\abovedisplayshortskip}{2pt}
        \setlength{\belowdisplayshortskip}{3pt}
        \setlength{\columnsep}{18pt}
        \setcounter{secnumdepth}{2}
        % --- pagination: no one-line spills, no headings stranded at a page foot
        \widowpenalty=10000
        \clubpenalty=10000
        \displaywidowpenalty=10000
        \makeatletter
        \newcommand{\NeedSpace}[1]{%
          \par\begingroup
          \dimen@=#1\relax
          \ifdim\pagegoal<\maxdimen
            \advance\dimen@ by \pagetotal
            \ifdim\dimen@>\pagegoal \vfil\break \fi
          \fi
          \endgroup}
        \makeatother
        \let\PlainSection\section
        \let\PlainSubsection\subsection
        \let\PlainSubsubsection\subsubsection
        \renewcommand*{\section}{\NeedSpace{8\baselineskip}\PlainSection}
        \renewcommand*{\subsection}{\NeedSpace{8\baselineskip}\PlainSubsection}
        \renewcommand*{\subsubsection}{\NeedSpace{6\baselineskip}\PlainSubsubsection}

bibliography: references.bib
